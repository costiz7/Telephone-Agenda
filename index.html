<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telephone Agenda</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comic+Relief:wght@400;700&family=Pacifico&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./styles/style.css">
</head>
<body>
    <div id="app-wrapper">
        <div id="toggle">
            <div class="flip-button">
                <div class="front">
                    <img src="./assets/sun.png" alt="sun">
                </div>
                <div class="back">
                    <img src="./assets/moon.png" alt="moon">
                </div>
            </div>
        </div>
        <div id="title-wrapper">
            <h1 class="title">T</h1>
            <h1 class="title">e</h1>
            <h1 class="title">l</h1>
            <h1 class="title">e</h1>
            <h1 class="title">p</h1>
            <h1 class="title">h</h1>
            <h1 class="title">o</h1>
            <h1 class="title">n</h1>
            <h1 class="title">e</h1>
            <h1 class="title">&nbsp;</h1>
            <h1 class="title">A</h1>
            <h1 class="title">g</h1>
            <h1 class="title">e</h1>
            <h1 class="title">n</h1>
            <h1 class="title">d</h1>
            <h1 class="title">a</h1>
        </div>
        <div id="form-wrapper">
            <div id="inputs">
                <div class="input-wrapper">
                    <label for="lastName">Last Name</label>
                    <input id="lastName" type="text" spellcheck="false" autocomplete="new-password">
                </div>
                <div class="input-wrapper">
                    <label for="firstName">First Name</label>
                    <input id="firstName" type="text" spellcheck="false" autocomplete="new-password">
                </div>
                <div class="input-wrapper">
                    <label for="phoneNumber">Phone Number</label>
                    <input id="phoneNumber" type="text" spellcheck="false" autocomplete="new-password">
                </div>
            </div>
            <div id="buttons">
                <button id="btn-add">Add</button>
                <button id="btn-delete">Delete</button>
            </div>
        </div>
        <div id="table-wrapper">
            <span>Number of people: </span>
            <table id="agenda">
                <tr>
                    <th>Last Name</th>
                    <th>First Name</th>
                    <th>Phone Number</th>
                </tr>
            </table>
        </div>
    </div>
    <script src="./scripts/init.js"></script>
    <script src="./scripts/persons.js"></script>
</body>
</html>
