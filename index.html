<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telephone Agenda</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,100..900;1,100..900&family=Roboto+Mono:ital,wght@0,100..700;1,100..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./styles/style.css">
</head>
<body>
    <div id="app-wrapper">
        <div id="title-wrapper">
            <h1 id="title">Telephone Agenda</h1>
        </div>
        <div id="form-wrapper">
            <div id="inputs">
                <div class="input-wrapper">
                    <label for="lastName">Last Name</label>
                    <input id="lastName" type="text">
                </div>
                <div class="input-wrapper">
                    <label for="firstName">First Name</label>
                    <input id="firstName" type="text">
                </div>
                <div class="input-wrapper">
                    <label for="phoneNumber">Phone Number</label>
                    <input id="phoneNumber" type="text">
                </div>
            </div>
            <div id="buttons">
                <button id="btn-add">Add Person</button>
                <button id="btn-delete">Delete Person</button>
            </div>
        </div>
        <div id="table-wrapper">
            <table id="agenda" border="1">
                <tr>
                    <th>Last Name</th>
                    <th>First Name</th>
                    <th>Phone Number</th>
                </tr>
            </table>
        </div>
    </div>
    <script src="./scripts/init.js"></script>
    <script src="./scripts/persons.js"></script>
</body>
</html>
