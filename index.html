<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telephone Agenda</title>
    <link rel="stylesheet" href="./styles/style.css">
</head>
<body>
    <div id="app-wrapper">
        <div id="title-wrapper">
            <h1 id="title">Telephone Agenda</h1>
        </div>
        <div id="form-wrapper">
            <div id="inputs">
                <div id="last-name">
                    <span>Last Name</span>
                    <input type="text">
                </div>
                <div id="first-name">
                    <span>First Name</span>
                    <input type="text">
                </div>
                <div id="phone-number">
                    <span>Phone Number</span>
                    <input type="text">
                </div>
            </div>
            <div id="buttons">
                <button id="btn-add">Add Person</button>
                <button id="btn-delete">Delete Person</button>
            </div>
        </div>
        <div id="table-wrapper">
            <table id="agenda" border="1">
                <tr>
                    <th>Last Name</th>
                    <th>First Name</th>
                    <th>Phone Number</th>
                </tr>
            </table>
        </div>
    </div>
    <script src="./scripts/init.js"></script>
    <script src="./scripts/persons.js"></script>
</body>
</html>
